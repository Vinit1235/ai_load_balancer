<!DOCTYPE html>
<html>
<head>
    <title>Worker Cards - Diagnostic</title>
    <script src="api-config.js"></script>
    <style>
        body { font-family: monospace; background: #0a0f2a; color: #e2e8ff; padding: 20px; }
        .section { margin: 20px 0; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px; }
        h2 { color: #22d3ee; }
        .log { margin: 10px 0; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 4px; border-left: 3px solid #c084fc; }
        .error { border-left-color: #ef4444; }
        .success { border-left-color: #10b981; }
        .card { background: rgba(168,85,247,0.1); border: 1px solid #c084fc; border-radius: 8px; padding: 12px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🔧 Worker Cards Diagnostic</h1>
    
    <div class="section">
        <h2>API Configuration</h2>
        <div id="config"></div>
    </div>

    <div class="section">
        <h2>API Test: /cluster/status</h2>
        <div id="api-test"></div>
    </div>

    <div class="section">
        <h2>Worker Cards Rendering Test</h2>
        <div id="grid-test"></div>
    </div>

    <script>
        async function runDiagnostic() {
            const logs = [];
            
            // Test 1: API Config
            logs.push({ type: 'info', msg: `API Base URL: ${API_CONFIG.BASE_URL}` });
            logs.push({ type: 'info', msg: `API Prefix: ${API_CONFIG.API_PREFIX}` });
            
            // Test 2: Fetch cluster status
            try {
                const status = await apiGetClusterStatus();
                logs.push({ type: 'success', msg: `✓ API call successful` });
                logs.push({ type: 'info', msg: `Got ${status.nodes?.length || 0} nodes` });
                
                if (status.nodes && status.nodes.length > 0) {
                    logs.push({ type: 'success', msg: `✓ Nodes data:` });
                    status.nodes.forEach(n => {
                        logs.push({ type: 'info', msg: `  - ${n.name}: CPU ${n.cpu}%, RAM ${n.ram}%, Disk ${n.disk_percent}%` });
                    });
                } else {
                    logs.push({ type: 'error', msg: `✗ No nodes returned by API` });
                }
            } catch(e) {
                logs.push({ type: 'error', msg: `✗ API call failed: ${e.detail || e.toString()}` });
            }
            
            // Display logs
            document.getElementById('config').innerHTML = logs
                .slice(0, 2)
                .map(l => `<div class="log ${l.type}">${l.msg}</div>`)
                .join('');
            
            document.getElementById('api-test').innerHTML = logs
                .slice(2)
                .map(l => `<div class="log ${l.type}">${l.msg}</div>`)
                .join('');
            
            // Test 3: Render cards
            const gridDiv = document.getElementById('grid-test');
            const nodes = await apiGetClusterStatus().then(s => s.nodes || []).catch(() => []);
            
            if (nodes.length === 0) {
                gridDiv.innerHTML = `<div class="log error">✗ No nodes to render</div>`;
            } else {
                gridDiv.innerHTML = `<div class="log success">✓ Rendering ${nodes.length} cards:</div>` +
                    nodes.map(n => `
                        <div class="card">
                            <strong>${n.name}</strong><br/>
                            CPU: ${n.cpu}% | RAM: ${n.ram}% | GPU: ${n.gpu_available ? n.gpu_utilization + '%' : 'N/A'} | Disk: ${n.disk_percent}%
                        </div>
                    `).join('');
            }
        }
        
        runDiagnostic();
    </script>
</body>
</html>
